<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mapa de Referências - BNI ES Emoções</title>
<style>
  :root { --red:#cf142b; --ink:#151515; --bg:#f3f4f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); }
  .toolbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 16px; background:#fff; border-bottom:1px solid #ddd; box-shadow:0 2px 10px rgba(0,0,0,.07); }
  .toolbar h1 { margin:0 auto 0 0; font-size:18px; font-weight:700; }
  button { appearance:none; border:0; border-radius:8px; padding:10px 15px; font-weight:700; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.55; cursor:wait; }
  .primary { background:var(--red); color:#fff; }
  .secondary { background:#eceff2; color:#222; }
  .status { font-size:12px; color:#5a5a5a; min-width:120px; text-align:right; }
  main { padding:18px; }
  .hint { max-width:1754px; margin:0 auto 10px; font-size:13px; color:#555; }
  .map-shell { width:min(100%, 1754px); margin:0 auto; position:relative; aspect-ratio:1754/1240; container-type:inline-size; background:#fff; box-shadow:0 4px 22px rgba(0,0,0,.12); }
  .map-shell > img { position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }
  textarea.ref { position:absolute; z-index:5; resize:none; border:1px dashed transparent; border-radius:5px; background:rgba(255,255,255,0); padding:.25cqw .35cqw; font:600 clamp(8px, .78cqw, 14px)/1.15 Arial, Helvetica, sans-serif; color:#111; text-align:center; overflow:hidden; outline:none; transition:background .15s,border-color .15s; }
  textarea.ref:hover { border-color:rgba(207,20,43,.45); background:rgba(255,255,255,.72); }
  textarea.ref:focus { border-color:var(--red); background:rgba(255,255,255,.93); box-shadow:0 0 0 2px rgba(207,20,43,.12); }
  @media (max-width:750px) {
    .toolbar h1 { width:100%; margin-bottom:2px; }
    .status { display:none; }
    main { padding:8px; overflow-x:auto; }
    .map-shell { min-width:880px; }
    .hint { min-width:880px; }
  }
</style>
</head>
<body>
  <header class="toolbar">
    <h1>Mapa de Referências - BNI ES Emoções</h1>
    <button class="secondary" id="clearBtn" type="button">Limpar pedidos</button>
    <button class="primary" id="pdfBtn" type="button">Baixar PDF</button>
    <span class="status" id="status">Preenchimento local desta sessão</span>
  </header>
  <main>
    <div class="hint">Clique dentro de qualquer campo <b>Pedido de Referência</b>, digite o pedido e depois use <b>Baixar PDF</b>. Ao abrir ou atualizar a página, os campos começam sempre vazios.</div>

  function latin1Bytes(s) {
    const out = new Uint8Array(s.length);
    for (let i=0;i<s.length;i++) {

    let p=0; for(const c of chunks) { out.set(c,p); p+=c.length; } return out;
  }
  function pdfEscape(s) { return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
  function wrapText(text, maxChars) {
    const result=[];
    for (const para of text.replace(/\r/g,'').split('\n')) {
      const words=para.trim().split(/\s+/).filter(Boolean);
      if (!words.length) { result.push(''); continue; }
      let line='';
      for (const word of words) {
        if (!line) { line=word; continue; }
        if ((line+' '+word).length <= maxChars) line += ' '+word;
        else { result.push(line); line=word; }
      }
      if(line) result.push(line);
    }
    return result.slice(0,4);
  }
  function makePdf() {
    const jpeg = b64Bytes(document.getElementById('baseImage').src.split(',')[1]);
    let content = `q\n${PDF_W} 0 0 ${PDF_H} 0 0 cm\n/Im0 Do\nQ\n`;
    content += 'BT\n/F1 8 Tf\n0 g\n';
    FIELDS.forEach(f => {
      const raw=(values[f.id]||'').trim();
      if(!raw) return;
      const boxW=(f.w-24)*PDF_W/NATIVE_W;
      const boxH=(f.h-38)*PDF_H/NATIVE_H;
      const boxX=(f.x+12)*PDF_W/NATIVE_W;
      const boxTop=(f.y+34)*PDF_H/NATIVE_H;
      let fs=8.2;
      let maxChars=Math.max(16, Math.floor(boxW/(fs*0.55)));
      let lines=wrapText(raw,maxChars);
      while(lines.length>3 && fs>6.2) { fs-=0.4; maxChars=Math.max(16,Math.floor(boxW/(fs*0.55))); lines=wrapText(raw,maxChars); }
      lines=lines.slice(0,3);
      const lh=fs*1.08;
      const totalH=lines.length*lh;
      const topY=PDF_H-boxTop;
      let baseline=topY - Math.max(fs, (boxH-totalH)/2 + fs*0.82);
      content += `/F1 ${fs.toFixed(2)} Tf\n`;
      for(const line of lines) {
        const approxW=line.length*fs*0.52;
        const x=boxX + Math.max(1,(boxW-approxW)/2);
        content += `1 0 0 1 ${x.toFixed(2)} ${baseline.toFixed(2)} Tm (${pdfEscape(line)}) Tj\n`;
        baseline -= lh;
      }
    });
    content += 'ET\n';
    const contentBytes=latin1Bytes(content);
    const chunks=[]; const offsets=[0]; let pos=0;
    const addRaw = b => { chunks.push(b); pos+=b.length; };
    const addStr = s => addRaw(latin1Bytes(s));
    const addObj = (n,body) => { offsets[n]=pos; addStr(`${n} 0 obj\n${body}\nendobj\n`); };
    addStr('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    addObj(1,'<< /Type /Catalog /Pages 2 0 R >>');
    addObj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    addObj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PDF_W} ${PDF_H}] /Resources << /XObject << /Im0 5 0 R >> /Font << /F1 4 0 R >> >> /Contents 6 0 R >>`);
    addObj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    offsets[5]=pos;
    addStr(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${NATIVE_W} /Height ${NATIVE_H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
    addRaw(jpeg); addStr('\nendstream\nendobj\n');
    offsets[6]=pos;
    addStr(`6 0 obj\n<< /Length ${contentBytes.length} >>\nstream\n`);
    addRaw(contentBytes); addStr('\nendstream\nendobj\n');
    const xrefPos=pos;
    addStr('xref\n0 7\n0000000000 65535 f \n');
    for(let i=1;i<=6;i++) addStr(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
    addStr(`trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`);
    return concat(chunks);
  }

  document.getElementById('pdfBtn').addEventListener('click', () => {
    const btn=document.getElementById('pdfBtn'); btn.disabled=true; const old=btn.textContent; btn.textContent='Gerando PDF...';
    try {
      const bytes=makePdf();
      const blob=new Blob([bytes],{type:'application/pdf'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='mapa_referencias_bni_emocoes.pdf'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
      status.textContent='PDF gerado';
    } catch(err) { console.error(err); alert('Ocorreu um erro ao gerar o PDF.'); }
    finally { btn.disabled=false; btn.textContent=old; }
  });
})();
</script>
